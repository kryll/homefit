name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests y APK debug
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Capturas de UI (Robolectric)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-shots
          path: app/build/outputs/compose-shots/
          if-no-files-found: warn
          retention-days: 14

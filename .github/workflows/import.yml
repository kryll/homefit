name: import-payload
on:
  push:
    branches: ['import/**']
    paths: ['**payload.tar.gz', '**payload.b64']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack payload
        run: |
          if ls ./*payload.b64 >/dev/null 2>&1; then
            base64 -d ./*payload.b64 > payload.tar.gz
            rm -f ./*payload.b64
          else
            mv ./*payload.tar.gz payload.tar.gz
          fi
          tar xzf payload.tar.gz
          rm -f payload.tar.gz
          if [ -f DELETE.txt ]; then xargs -r rm -rf < DELETE.txt; rm DELETE.txt; fi
          git config user.name "homefit-import"
          git config user.email "homefit-import@users.noreply.github.com"
          git add -A
          git commit -m "Import: ${{ github.ref_name }}"
          git push

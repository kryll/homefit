name: HomeFit encrypted backup dummy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homefit-signing-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: homefit-backup-once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Encrypt and verify dummy backup without app code
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_DEST_TOKEN: ${{ secrets.BACKUP_DEST_TOKEN }}
          BACKUP_RECOVERY_PASSPHRASE: ${{ secrets.BACKUP_RECOVERY_PASSPHRASE }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          umask 077
          export BACKUP_MODE=dummy
          python3 - <<'PYTHON'
          import base64, hashlib, json, os, pathlib, shutil, subprocess, tempfile, urllib.request
          
          DEST = 'kryll/homefit-signing-backups'
          DEST_ID = 1444361176
          MODE = os.environ['BACKUP_MODE']
          assert MODE in ('dummy', 'real')
          assert os.environ['GITHUB_REPOSITORY'] == 'kryll/homefit'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          RUN = os.environ['GITHUB_RUN_ID']
          ATTEMPT = os.environ['GITHUB_RUN_ATTEMPT']
          assert RUN.isdigit() and ATTEMPT.isdigit()
          token = os.environ.pop('BACKUP_DEST_TOKEN')
          phrase = os.environ.pop('BACKUP_RECOVERY_PASSPHRASE')
          assert token and phrase
          
          def api(method, path, body=None, auth=token):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request('https://api.github.com/' + path, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + auth, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except Exception:
                  raise RuntimeError("Backup API request failed (details suppressed)") from None
          
          def quiet(args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0:
                  raise RuntimeError('Private material validation or encryption failed')
              return result.stdout
          
          # Verify provenance before copying any original secret into a file.
          head = api('GET', 'repos/kryll/homefit/git/ref/heads/main', auth=os.environ['GH_TOKEN'])['object']['sha']
          assert head == os.environ['GITHUB_SHA'], 'Source main advanced'
          repo = api('GET', 'repos/' + DEST)
          assert repo['private'] is True and repo['id'] == DEST_ID and repo['full_name'] == DEST
          root = pathlib.Path(tempfile.mkdtemp(prefix='homefit-backup-', dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          try:
              os.environ['GNUPGHOME'] = str(root / 'gnupg')
              (root / 'gnupg').mkdir(mode=0o700)
              key = root / 'source.jks'
              fields = ['HOMEFIT_KEYSTORE_B64', 'HOMEFIT_KEYSTORE_PASSWORD', 'HOMEFIT_KEY_ALIAS', 'HOMEFIT_KEY_PASSWORD']
              if MODE == 'dummy':
                  # Known disposable fixture, never the app's signer or a persistent credential.
                  values = dict(zip(fields, ['', 'fixture-store-only', 'fixture-alias', 'fixture-key-only']))
                  os.environ['HF_STORE'] = values[fields[1]]
                  os.environ['HF_KEY'] = values[fields[3]]
                  quiet(['keytool', '-genkeypair', '-storetype', 'JKS', '-keystore', str(key), '-alias', values[fields[2]],
                         '-storepass:env', 'HF_STORE', '-keypass:env', 'HF_KEY', '-keyalg', 'RSA', '-keysize', '2048',
                         '-validity', '2', '-dname', 'CN=HOMEFIT BACKUP DISPOSABLE TEST', '-noprompt'])
                  values[fields[0]] = base64.b64encode(key.read_bytes()).decode()
              else:
                  values = {name: os.environ.pop(name) for name in fields}
                  assert all(values.values()), 'Missing source signing secret'
                  key.write_bytes(base64.b64decode(values[fields[0]], validate=True))
                  os.environ['HF_STORE'] = values[fields[1]]
                  os.environ['HF_KEY'] = values[fields[3]]
              key.chmod(0o600)
              cert = quiet(['keytool', '-exportcert', '-keystore', str(key), '-alias', values[fields[2]], '-storepass:env', 'HF_STORE'])
              assert cert, 'No signer certificate'
              # Import the selected private entry to a disposable copy: validates store password, alias and key password.
              quiet(['keytool', '-importkeystore', '-srckeystore', str(key), '-srcstorepass:env', 'HF_STORE',
                     '-srcalias', values[fields[2]], '-srckeypass:env', 'HF_KEY', '-destkeystore', str(root / 'validation.jks'),
                     '-deststoretype', 'JKS', '-deststorepass:env', 'HF_STORE', '-destkeypass:env', 'HF_KEY', '-noprompt'])
              payload = json.dumps({'format': 'homefit-signing-secrets-v1', 'secrets': values}, ensure_ascii=True, sort_keys=True).encode()
              (root / 'package.json').write_bytes(payload)
              (root / 'phrase').write_text(phrase)
              (root / 'phrase').chmod(0o600)
              quiet(['gpg', '--batch', '--yes', '--pinentry-mode', 'loopback', '--passphrase-file', str(root / 'phrase'),
                     '--symmetric', '--cipher-algo', 'AES256', '--armor', '--output', str(root / 'backup.asc'), str(root / 'package.json')])
              ciphertext = (root / 'backup.asc').read_bytes()
              prefix = ('tests/dummy-signing-' if MODE == 'dummy' else 'homefit/existing-signing-') + RUN + '-' + ATTEMPT
              metadata = {'format': 'homefit-signing-backup-metadata-v1', 'mode': MODE, 'source': 'kryll/homefit',
                          'source_sha': head, 'run_id': RUN, 'run_attempt': ATTEMPT, 'secret_count': 4,
                          'certificate_sha256': hashlib.sha256(cert).hexdigest(),
                          'ciphertext_sha256': hashlib.sha256(ciphertext).hexdigest()}
              uploaded = api('PUT', 'repos/' + DEST + '/contents/' + prefix + '.asc',
                             {'message': 'Store ' + MODE + ' encrypted HomeFit signing backup', 'content': base64.b64encode(ciphertext).decode(), 'branch': 'main'})
              # Independently retrieve the persisted ciphertext rather than decrypting only the local candidate.
              stored = api('GET', 'repos/' + DEST + '/contents/' + prefix + '.asc?ref=main')
              remote = base64.b64decode(stored['content'])
              assert remote == ciphertext
              (root / 'retrieved.asc').write_bytes(remote)
              quiet(['gpg', '--batch', '--yes', '--pinentry-mode', 'loopback', '--passphrase-file', str(root / 'phrase'),
                     '--output', str(root / 'recovered.json'), '--decrypt', str(root / 'retrieved.asc')])
              recovered = json.loads((root / 'recovered.json').read_bytes())
              assert recovered['secrets'] == values and recovered['format'] == 'homefit-signing-secrets-v1'
              assert base64.b64decode(recovered['secrets'][fields[0]], validate=True) == key.read_bytes()
              metadata['remote_recovery_verified'] = True
              info = api('PUT', 'repos/' + DEST + '/contents/' + prefix + '.json',
                         {'message': 'Record verified ' + MODE + ' HomeFit backup metadata',
                          'content': base64.b64encode(json.dumps(metadata, indent=2).encode()).decode(), 'branch': 'main'})
              print(json.dumps({'result': 'PASS', **metadata, 'backup_url': uploaded['content']['html_url'], 'metadata_url': info['content']['html_url']}))
          finally:
              shutil.rmtree(root)
              for field in ('HF_STORE', 'HF_KEY', 'GNUPGHOME'):
                  os.environ.pop(field, None)
          PYTHON
      - name: Remove private temporary files on every outcome
        if: always()
        shell: bash
        run: |
          set +x
          set -euo pipefail
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'homefit-backup-*' -exec rm -rf -- {} +
          test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'homefit-backup-*' -print -quit)"

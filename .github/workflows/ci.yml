name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests y APK debug
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease
      - name: Capturas de UI (Robolectric)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-shots
          path: app/build/outputs/compose-shots/
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar capturas en la rama ci-shots (solo PRs del propio repo)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp -r app/build/outputs/compose-shots/. /tmp/pub/ || true
          cd /tmp/pub
          echo "Capturas Robolectric del commit ${{ github.event.pull_request.head.sha }}" > README.txt
          git init -q
          git config user.name "homefit-ci"
          git config user.email "homefit-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "shots ${{ github.event.pull_request.head.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-shots
